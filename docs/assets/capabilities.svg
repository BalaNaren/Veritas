<rect width="604" height="250" rx="24" fill="#0c1426" stroke="#1d2e4d" stroke-width="2"/>
<rect x="6" y="6" width="592" height="238" rx="19" fill="none" stroke="#35f2c0" stroke-width="3" opacity=".9" filter="url(#g)"/>
<rect x="6" y="6" width="592" height="238" rx="19" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="1"/>
<g transform="translate(96 100)"><circle r="62" fill="#101d36"/><path d="M0 -38 L34 -24 V8 C34 28 16 40 0 47 C-16 40 -34 28 -34 8 V-24 Z" fill="none" stroke="#35f2c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#g)"/><path d="M-15 4 L-3 17 L19 -10" fill="none" stroke="#e9fff9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#g)"/></g>
<text x="190" y="72" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', 'Segoe UI', Roboto, sans-serif" font-size="15" letter-spacing="5" fill="#35f2c0" textLength="196.7" lengthAdjust="spacingAndGlyphs">VERITAS / TRUST</text>
<text x="190" y="116" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="36" fill="#e8eef8" textLength="254.1" lengthAdjust="spacingAndGlyphs">Verified claims</text>
<text x="40" y="186" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', 'Segoe UI', Roboto, sans-serif" font-size="21" fill="#b4c3da" textLength="454.1" lengthAdjust="spacingAndGlyphs">Every fact is tied to a source and an exact quote.</text>
<text x="40" y="216" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', 'Segoe UI', Roboto, sans-serif" font-size="21" fill="#b4c3da" textLength="519.4" lengthAdjust="spacingAndGlyphs">An independent checker reads it. What fails is removed.</text>
</g>
<g transform="translate(652 10)">
<rect width="604" height="250" rx="24" fill="#0c1426" stroke="#1d2e4d" stroke-width="2"/>
<rect x="6" y="6" width="592" height="238" rx="19" fill="none" stroke="#36d6ff" stroke-width="3" opacity=".9" filter="url(#g)"/>
<rect x="6" y="6" width="592" height="238" rx="19" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="1"/>
<g transform="translate(96 100)"><circle r="62" fill="#101d36"/><g fill="none" stroke="#36d6ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#g)"><circle cx="-32" cy="0" r="9"/><circle cx="30" cy="-26" r="9"/><circle cx="30" cy="0" r="9"/><circle cx="30" cy="26" r="9"/><path d="M-23 0 L21 -24 M-23 0 L21 0 M-23 0 L21 24"/></g></g>
<text x="190" y="72" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', 'Segoe UI', Roboto, sans-serif" font-size="15" letter-spacing="5" fill="#36d6ff" textLength="197.5" lengthAdjust="spacingAndGlyphs">VERITAS / SPEED</text>
<text x="190" y="116" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="36" fill="#e8eef8" textLength="254.1" lengthAdjust="spacingAndGlyphs">Parallel agents</text>
<text x="40" y="186" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', 'Segoe UI', Roboto, sans-serif" font-size="21" fill="#b4c3da" textLength="518.2" lengthAdjust="spacingAndGlyphs">A planner splits the goal. Agents work at the same time.</text>
<text x="40" y="216" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', 'Segoe UI', Roboto, sans-serif" font-size="21" fill="#b4c3da" textLength="365.4" lengthAdjust="spacingAndGlyphs">You approve the plan and the cost first.</text>
</g>
<g transform="translate(24 280)">
<rect width="604" height="250" rx="24" fill="#0c1426" stroke="#1d2e4d" stroke-width="2"/>
<rect x="6" y="6" width="592" height="238" rx="19" fill="none" stroke="#ffc94a" stroke-width="3" opacity=".9" filter="url(#g)"/>
<rect x="6" y="6" width="592" height="238" rx="19" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="1"/>
<g transform="translate(96 100)"><circle r="62" fill="#101d36"/><g fill="none" stroke="#ffc94a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#g)"><path d="M-26 -34 H8 L22 -20 V34 H-26 Z"/><path d="M8 -34 V-20 H22"/><path d="M-16 -6 H12 M-16 8 H12 M-16 21 H2"/></g></g>
<text x="190" y="72" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', 'Segoe UI', Roboto, sans-serif" font-size="15" letter-spacing="5" fill="#ffc94a" textLength="260.9" lengthAdjust="spacingAndGlyphs">VERITAS / YOUR WORK</text>
<text x="190" y="116" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="36" fill="#e8eef8" textLength="322.1" lengthAdjust="spacingAndGlyphs">Your files and data</text>
<text x="40" y="186" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', 'Segoe UI', Roboto, sans-serif" font-size="21" fill="#b4c3da" textLength="450.5" lengthAdjust="spacingAndGlyphs">PDF, Word, Excel, CSV: cited to the exact page.</text>
<text x="40" y="216" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', 'Segoe UI', Roboto, sans-serif" font-size="21" fill="#b4c3da" textLength="424.8" lengthAdjust="spacingAndGlyphs">Numbers come only from code that really ran.</text>
</g>
<g transform="translate(652 280)">
<rect width="604" height="250" rx="24" fill="#0c1426" stroke="#1d2e4d" stroke-width="2"/>
