<text x="190" y="72" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', 'Segoe UI', Roboto, sans-serif" font-size="15" letter-spacing="5" fill="#8b7bff" textLength="230.0" lengthAdjust="spacingAndGlyphs">VERITAS / CONTROL</text>
<text x="190" y="116" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="36" fill="#e8eef8" textLength="256.1" lengthAdjust="spacingAndGlyphs">Safe by default</text>
<text x="40" y="186" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', 'Segoe UI', Roboto, sans-serif" font-size="21" fill="#b4c3da" textLength="512.5" lengthAdjust="spacingAndGlyphs">Code changes happen in a separate copy of your repo.</text>
<text x="40" y="216" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', 'Segoe UI', Roboto, sans-serif" font-size="21" fill="#b4c3da" textLength="429.5" lengthAdjust="spacingAndGlyphs">Commit, merge and push always ask you first.</text>
</g>
</svg>