<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-label="How a Veritas task flows">
<defs><filter id="g" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16253f" stroke-width="1"/></pattern></defs><rect width="1280" height="470" rx="18" fill="#0a1020" stroke="#1d2e4d"/><rect width="1280" height="470" rx="18" fill="url(#grid)" opacity=".45"/>
<text x="40" y="58" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="34" letter-spacing="1" fill="#e8eef8">HOW A TASK FLOWS</text>
<text x="40" y="92" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#9fb2cc">From a goal to a cited result. Nothing reaches the report without passing the check.</text>
<g transform="translate(40 130)"><rect width="212" height="112" rx="18" fill="#101b33" stroke="#36d6ff" stroke-width="3" filter="url(#g)"/><rect x="0" y="14" width="5" height="84" rx="2" fill="#ff5d73"/>
<text x="18" y="30" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#ff5d73">01</text>
<text x="106" y="66" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="25" fill="#e8eef8">Goal</text>
<text x="106" y="92" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8ea3bd">you describe the work</text></g><path d="M252 186 H284" stroke="#2e6e8c" stroke-width="3" fill="none"/><path d="M278 178 L290 186 L278 194" stroke="#2e6e8c" stroke-width="3" fill="none" stroke-linecap="round"/>
<g transform="translate(292 130)"><rect width="212" height="112" rx="18" fill="#101b33" stroke="#36d6ff" stroke-width="3" filter="url(#g)"/><rect x="0" y="14" width="5" height="84" rx="2" fill="#ff5d73"/>
<text x="18" y="30" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#ff5d73">02</text>
<text x="106" y="66" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="25" fill="#e8eef8">Plan</text>
<text x="106" y="92" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8ea3bd">you approve it + cost</text></g><path d="M504 186 H536" stroke="#2e6e8c" stroke-width="3" fill="none"/><path d="M530 178 L542 186 L530 194" stroke="#2e6e8c" stroke-width="3" fill="none" stroke-linecap="round"/>
<g transform="translate(544 130)"><rect width="212" height="112" rx="18" fill="#101b33" stroke="#36d6ff" stroke-width="3" filter="url(#g)"/><rect x="0" y="14" width="5" height="84" rx="2" fill="#ff5d73"/>
<text x="18" y="30" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#ff5d73">03</text>
<text x="106" y="66" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="25" fill="#e8eef8">Agents</text>
<text x="106" y="92" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8ea3bd">work in parallel</text></g><path d="M756 186 H788" stroke="#2e6e8c" stroke-width="3" fill="none"/><path d="M782 178 L794 186 L782 194" stroke="#2e6e8c" stroke-width="3" fill="none" stroke-linecap="round"/>
<g transform="translate(796 130)"><rect width="212" height="112" rx="18" fill="#101b33" stroke="#36d6ff" stroke-width="3" filter="url(#g)"/><rect x="0" y="14" width="5" height="84" rx="2" fill="#ff5d73"/>
<text x="18" y="30" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#ff5d73">04</text>
<text x="106" y="66" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="25" fill="#e8eef8">Check</text>
<text x="106" y="92" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8ea3bd">each claim vs its source</text></g><path d="M1008 186 H1040" stroke="#2e6e8c" stroke-width="3" fill="none"/><path d="M1034 178 L1046 186 L1034 194" stroke="#2e6e8c" stroke-width="3" fill="none" stroke-linecap="round"/>
<g transform="translate(1048 130)"><rect width="212" height="112" rx="18" fill="#101b33" stroke="#36d6ff" stroke-width="3" filter="url(#g)"/><rect x="0" y="14" width="5" height="84" rx="2" fill="#ff5d73"/>
<text x="18" y="30" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#ff5d73">05</text>
<text x="106" y="66" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="25" fill="#e8eef8">Result</text>
<text x="106" y="92" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8ea3bd">cited, with a summary</text></g>
<path d="M902 242 V300 H770" stroke="#ff5d73" stroke-width="3" fill="none" stroke-dasharray="7 6"/><path d="M780 292 L768 300 L780 308" stroke="#ff5d73" stroke-width="3" fill="none" stroke-linecap="round"/>
<g transform="translate(556 262)"><rect width="212" height="84" rx="16" fill="#1b1220" stroke="#ff5d73" stroke-width="3"/><text x="106" y="38" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="22" fill="#e8eef8">Removed</text><text x="106" y="64" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8ea3bd">listed, with the reason</text></g>
<path d="M1000 242 V300 H1150" stroke="#ffc94a" stroke-width="3" fill="none" stroke-dasharray="7 6"/><path d="M1138 292 L1150 300 L1138 308" stroke="#ffc94a" stroke-width="3" fill="none" stroke-linecap="round"/>
<g transform="translate(1048 262)"><rect width="212" height="84" rx="16" fill="#1d1a10" stroke="#ffc94a" stroke-width="3"/><text x="106" y="38" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="22" fill="#e8eef8">Flagged</text><text x="106" y="64" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8ea3bd">shown with a warning</text></g>
<path d="M1154 262 V250" stroke="#ffc94a" stroke-width="3" fill="none"/><path d="M1146 256 L1154 244 L1162 256" stroke="#ffc94a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle r="5" fill="#36d6ff"><animateMotion path="M252 186 H292" dur="2s" repeatCount="indefinite"/></circle><circle r="5" fill="#36d6ff"><animateMotion path="M504 186 H544" dur="2.4s" repeatCount="indefinite"/></circle><circle r="5" fill="#36d6ff"><animateMotion path="M756 186 H796" dur="2.8s" repeatCount="indefinite"/></circle><circle r="5" fill="#35f2c0"><animateMotion path="M1008 186 H1048" dur="3.2s" repeatCount="indefinite"/></circle>
<text x="40" y="440" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#7f97b3">Conceptual flow. No live metrics. Green = confirmed, amber = flagged, coral = removed.</text>
</svg>