<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-label="Veritas: every claim checked">
<defs><filter id="g" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16253f" stroke-width="1"/></pattern>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1730"/><stop offset="1" stop-color="#070b16"/></linearGradient>
<linearGradient id="side" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1b36"/><stop offset="1" stop-color="#0a1226"/></linearGradient></defs>
<rect width="1280" height="470" rx="18" fill="url(#bg)" stroke="#1d2e4d"/><rect width="1280" height="470" rx="18" fill="url(#grid)" opacity=".5"/>
<polygon points="930,0 1280,0 1280,470 880,470" fill="url(#side)"/>
<path d="M56 46 H830 M56 46 V118" stroke="#35f2c0" stroke-width="3" fill="none" filter="url(#g)"/>
<path d="M56 46 H400" stroke="#d9fff5" stroke-width="2" fill="none"><animate attributeName="d" values="M56 46 H200;M56 46 H830;M56 46 H200" dur="8s" repeatCount="indefinite"/></path>
<text x="84" y="84" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" letter-spacing="7" fill="#35f2c0">VERITAS / THE AGENT THAT SHOWS ITS WORK</text>
<text x="80" y="198" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="92" letter-spacing="-1" fill="#5b6676">EVERY CLAIM.</text>
<text x="80" y="288" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="92" letter-spacing="-1" fill="#35f2c0" filter="url(#g)">CHECKED.</text>
<text x="82" y="334" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" fill="#8ea3bd">Give it a goal. Parallel agents do the work.</text>
<text x="82" y="366" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" fill="#8ea3bd">An independent checker tests every claim against its source.</text>
<path d="M82 392 H830" stroke="#1d2e4d" stroke-width="2"/>
<g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" letter-spacing="4" fill="#7f97b3"><text x="82" y="434">01 / PLAN</text><text x="332" y="434">02 / WORK</text><text x="582" y="434">03 / VERIFY</text></g>
<g transform="translate(1085 225)">
<circle r="128" fill="#0b1630" stroke="#1d2e4d" stroke-width="2"/>
<g><circle r="150" fill="none" stroke="#2a4a78" stroke-width="2" stroke-dasharray="2 14" stroke-linecap="round"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/></g>
<g filter="url(#g)"><circle r="108" fill="none" stroke="#36d6ff" stroke-width="5" stroke-dasharray="120 560" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/></circle>
<circle r="108" fill="none" stroke="#ff5d73" stroke-width="5" stroke-dasharray="40 640" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="9s" repeatCount="indefinite"/></circle></g>
<path d="M0 -66 L58 -42 V8 C58 44 28 68 0 80 C-28 68 -58 44 -58 8 V-42 Z" fill="#0d2038" stroke="#35f2c0" stroke-width="5" stroke-linejoin="round" filter="url(#g)"/>
<path d="M-26 6 L-6 28 L30 -18" fill="none" stroke="#e9fff9" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="110" stroke-dashoffset="110"><animate attributeName="stroke-dashoffset" values="110;0;0;110" keyTimes="0;.3;.85;1" dur="5s" repeatCount="indefinite"/></path>
<text y="178" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" letter-spacing="6" fill="#7f97b3">VERIFIED</text></g>
</svg>